observed:
  name: "Fig 7a observed exclusion"
  description: >
    $(m_{\tilde{\tau}}\,[\mathrm{GeV}],\,c\tau_{0}\,[\mathrm{mm}])$
    points lying on the observed exclusion contour, for the maximally mixed scenario.
  data_file: "hepdata_Figure7a_limits_obs.yaml"

observed_exclusion:
  name: "Figure 7a obs exclusion"
  description: >
    $(m_{\tilde{\tau}}\,[\mathrm{GeV}],\,c\tau_{0}\,[\mathrm{mm}])$
    points lying on the observed exclusion contour, for the mass-degenerate scenario.
  keywords:
    - name: cmenergies
      values: [13000.0]
  data_file: "hepdata_Figure7a_exclusion_obs.yaml"

obs_plus1sigma:
  name: "Fig 7a obs +1σ exclusion"
  description: >
    $(m_{\tilde{\tau}} [\text{GeV}], c\tau_{0} [\text{mm}])$ 
    points lying on the observed$+1\sigma$ exclusion contour, for the maximally mixed scenario.
  data_file: "hepdata_Figure7a_exclusion_obs-p1sigma.yaml"

obs_minu1sigma:
  name: "Fig 7a obs -1σ exclusion"
  description: >
    $(m_{\tilde{\tau}} [\text{GeV}], c\tau_{0} [\text{mm}])$
    points lying on the observed$-1\sigma$ exclusion contour, for the maximally mixed scenario.
  data_file: "hepdata_Figure7a_exclusion_obs-m1sigma.yaml"

exp_contour:
  name: "Figure 7a exp"
  description: >
    $(m_{\tilde{\tau}} [\text{GeV}], c\tau_{0} [\text{mm}])$
    points lying on the expected exclusion contour, for the maximally mixed scenario.
  keywords:
    - name: cmenergies
      values: [13000.0]
  data_file: "hepdata_Figure7a_exclusion_exp.yaml"

exp_plus1sigma:
  name: "Fig 7a exp +1σ exclusion"
  description: >
    $(m_{\tilde{\tau}}\,[\mathrm{GeV}],\,c\tau_{0}\,[\mathrm{mm}])$
    points lying on the expected $+1\sigma$ exclusion contour, for the maximally mixed scenario.
  data_file: "hepdata_Figure7a_exclusion_exp-p1sigma.yaml"

exp_minus1sigma:
  name: "Fig 7a exp -1σ exclusion"
  description: >
    $(m_{\tilde{\tau}}\,[\mathrm{GeV}],\,c\tau_{0}\,[\mathrm{mm}])$
    points lying on the expected $-1\sigma$ exclusion contour, for the maximally mixed scenario.
  data_file: "hepdata_Figure7a_exclusion_exp-m1sigma.yaml"

exp_plus2sigma:
  name: "Fig 7a exp +2σ exclusion"
  description: >
    $(m_{\tilde{\tau}}\,[\mathrm{GeV}],\,c\tau_{0}\,[\mathrm{mm}])$
    points lying on the expected $+2\sigma$ exclusion contour, for the maximally mixed scenario.
  data_file: "hepdata_Figure7a_exclusion_exp-p2sigma.yaml"

exp_minus2sigma:
  name: "Fig 7a exp -2σ exclusion"
  description: >
    $(m_{\tilde{\tau}}\,[\mathrm{GeV}],\,c\tau_{0}\,[\mathrm{mm}])$
    points lying on the expected $-2\sigma$ exclusion contour, for the maximally mixed scenario.
  data_file: "hepdata_Figure7a_exclusion_exp-m2sigma.yaml"

