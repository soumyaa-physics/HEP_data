observed:
  name: "Figure 7b obs, mass-degenerate"
  description: >
    $(m_{\tilde{\tau}}\,[\mathrm{GeV}],\,c\tau_{0}\,[\mathrm{mm}])$
    points lying on the observed exclusion contour, for the mass-degenerate scenario.
  keywords:
    - name: cmenergies
      values: [13000.0]
  data_file: "hepdata_Figure7b_obs.yaml"

