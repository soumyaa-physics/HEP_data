# Figure 4
name: "Figure 4a"
description: "Distributions of $p_\text{T, j2}$ for events in the signal region.
  The signal distributions expected in the maximally mixed scenario for a few representative sets of $(m_{\tilde{\tau}} [\text{GeV}], c\tau_{0} [\text{mm}])$ values are overlaid: 
  (100, 50), (100, 100), (200, 50), and (200, 100). 
  In bins where the observed yield is zero, the Poissonian upper limit at 68% CL is shown as a positive uncertainty. 
  The last bin includes the overflow."
